name: Build and release TodoBar

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS application
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build TodoBar
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/TodoBar.app" "TodoBar-macos-arm64.zip"
          shasum -a 256 "TodoBar-macos-arm64.zip" > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoBar-macos-arm64
          path: |
            TodoBar-macos-arm64.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TodoBar-macos-arm64.zip
            SHA256SUMS.txt
